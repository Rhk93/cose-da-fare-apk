<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Da fare">
<title>Cose da Fare</title>
<style>:root{color-scheme:light}body{margin:0;padding-top:env(safe-area-inset-top,0px)}[hidden]{display:none!important}</style>
</head><body>

<style>
/* Layout: una sola schermata iOS, titolo grande, campo di aggiunta, liste raggruppate verdi. */
:root{
  --bg:#f2f2f7; --cell:#ffffff; --label:#000000;
  --label2:rgba(60,60,67,.62); --label3:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.18); --tint:#34c759; --tint-text:#1f8a3a; --tint-weak:rgba(52,199,89,.15);
  --bad:#ff3b30; --fill:rgba(120,120,128,.14); --scrim:rgba(0,0,0,.4);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,Roboto,"Helvetica Neue",Arial,sans-serif;
}
@font-face{font-family:'Nunito';font-weight:400;font-style:normal;font-display:swap;src:url(fonts/nunito-400.woff2) format('woff2')}
@font-face{font-family:'Nunito';font-weight:700;font-style:normal;font-display:swap;src:url(fonts/nunito-700.woff2) format('woff2')}
@font-face{font-family:'Lora';font-weight:400;font-style:normal;font-display:swap;src:url(fonts/lora-400.woff2) format('woff2')}
@font-face{font-family:'Lora';font-weight:700;font-style:normal;font-display:swap;src:url(fonts/lora-700.woff2) format('woff2')}
@font-face{font-family:'Caveat';font-weight:400;font-style:normal;font-display:swap;src:url(fonts/caveat-400.woff2) format('woff2')}
@font-face{font-family:'Caveat';font-weight:700;font-style:normal;font-display:swap;src:url(fonts/caveat-700.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-weight:400;font-style:normal;font-display:swap;src:url(fonts/jetbrains-mono-400.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-weight:700;font-style:normal;font-display:swap;src:url(fonts/jetbrains-mono-700.woff2) format('woff2')}
@font-face{font-family:'Poppins';font-weight:400;font-style:normal;font-display:swap;src:url(fonts/poppins-400.woff2) format('woff2')}
@font-face{font-family:'Poppins';font-weight:700;font-style:normal;font-display:swap;src:url(fonts/poppins-700.woff2) format('woff2')}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --cell:#1c1c1e; --label:#ffffff;
    --label2:rgba(235,235,245,.62); --label3:rgba(235,235,245,.3);
    --sep:rgba(84,84,88,.6); --tint:#30d158; --tint-text:#30d158; --tint-weak:rgba(48,209,88,.2);
    --bad:#ff453a; --fill:rgba(120,120,128,.28); --scrim:rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --cell:#1c1c1e; --label:#ffffff;
  --label2:rgba(235,235,245,.62); --label3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.6); --tint:#30d158; --tint-text:#30d158; --tint-weak:rgba(48,209,88,.2);
  --bad:#ff453a; --fill:rgba(120,120,128,.28); --scrim:rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--label);font:17px/1.3 var(--font);
  -webkit-font-smoothing:antialiased;
  padding-block:14px 60px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
button,input,textarea{font:inherit;color:inherit}
#app{max-width:640px;margin:0 auto}

.lt{margin:6px 0 14px}
.ltrow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.lt h1{margin:0;font-size:34px;line-height:1.1;font-weight:700;letter-spacing:.2px;color:var(--tint-text)}
.lt .sub{margin:4px 0 0;font-size:15px;color:var(--label2)}
.link{background:none;border:0;color:var(--tint-text);font-size:17px;padding:4px 0;cursor:pointer}
.link.small{font-size:15px}
.link:focus-visible,.btn:focus-visible,.chk:focus-visible,.row.act:focus-visible,.addbtn:focus-visible{outline:2px solid var(--tint);outline-offset:2px;border-radius:8px}

.add{display:flex;align-items:center;gap:10px;background:var(--cell);border-radius:14px;padding:6px 6px 6px 16px}
.add input{flex:1;min-width:0;border:0;background:none;padding:8px 0;font-size:17px}
.add input::placeholder{color:var(--label2)}
.add input:focus{outline:none}
.add:focus-within{box-shadow:0 0 0 2px var(--tint)}
.addbtn{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:var(--tint);display:grid;place-items:center;cursor:pointer;padding:0;transition:opacity .15s}
.addbtn:disabled{opacity:.35;cursor:default}
.addbtn svg{width:18px;height:18px;stroke:#fff;stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.bulk{text-align:right;margin:8px 4px 0}

.gh{display:flex;justify-content:space-between;align-items:center;margin:26px 16px 6px;font-size:13px;font-weight:400;text-transform:uppercase;letter-spacing:.02em;color:var(--label2)}
.gh button{text-transform:none;letter-spacing:0;font-size:15px}
.group{background:var(--cell);border-radius:14px;overflow:hidden}
.row{position:relative;display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:50px;transition:opacity .16s ease,transform .16s ease}
.row+.row::before{content:"";position:absolute;top:0;left:52px;right:0;height:.5px;background:var(--sep)}
.row.ed+.row::before,.row.act::before,.row.act+.row::before{left:16px}
.row.leaving{opacity:0;transform:translateX(10px)}
.chk{flex:none;width:26px;height:26px;border-radius:50%;border:1.6px solid var(--label3);background:none;display:grid;place-items:center;padding:0;cursor:pointer;transition:background .15s,border-color .15s;-webkit-tap-highlight-color:transparent}
.chk svg{width:15px;height:15px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.done .chk{background:var(--tint);border-color:var(--tint)}
.done .chk svg{opacity:1}
.tx{flex:1;min-width:0;overflow-wrap:anywhere;cursor:pointer;-webkit-tap-highlight-color:transparent;padding:4px 0}
.done .tx{color:var(--label2);text-decoration:line-through}
.row.ed .tx{cursor:default}
.row.ed input{flex:1;min-width:0;border:0;border-radius:8px;background:var(--fill);padding:8px 10px}
.row.ed input:focus-visible{outline:2px solid var(--tint)}
.del{flex:none;width:24px;height:24px;border-radius:50%;border:0;background:var(--bad);color:#fff;font-size:18px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0}
.row.act{width:100%;border:0;background:none;color:var(--bad);text-align:left;cursor:pointer}

.empty{text-align:center;padding:56px 24px;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty .ic{width:64px;height:64px;border-radius:50%;background:var(--tint-weak);color:var(--tint-text);display:grid;place-items:center}
.empty .ic svg{width:32px;height:32px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.empty h2{margin:6px 0 0;font-size:22px;font-weight:700}
.empty p{margin:0;color:var(--label2);font-size:15px;max-width:30ch}

#sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:var(--scrim)}
#sheet .sh{width:100%;max-width:640px;max-height:92%;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;
  padding:22px max(20px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.sh h3{margin:0;font-size:22px;font-weight:700;text-align:center}
.sh p{margin:0;font-size:15px;color:var(--label2);text-align:center}
#bulk-text{width:100%;min-height:200px;border:0;border-radius:12px;background:var(--cell);padding:12px;resize:vertical}
#bulk-text:focus-visible{outline:2px solid var(--tint)}
.btn{display:block;width:100%;border:0;border-radius:14px;background:var(--tint);color:#fff;font-weight:600;font-size:17px;padding:15px 16px;text-align:center;cursor:pointer}
.btn.ghost{background:none;color:var(--tint-text);font-weight:400}
.stack{display:flex;flex-direction:column;gap:10px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--label);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:15px;max-width:min(90%,420px);text-align:center}
.hd{display:flex;align-items:center;gap:18px}
.dot{width:26px;height:26px;border-radius:50%;border:0;background:var(--tint);box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--label3);cursor:pointer;padding:0}
.dot:focus-visible{outline:2px solid var(--tint);outline-offset:4px}
.sh .cap{font-size:13px;text-transform:uppercase;letter-spacing:.02em;color:var(--label2);margin:6px 16px -6px}
.fonts{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:4px 0}
.fonts button{border:0;border-radius:12px;background:var(--fill);color:var(--label);padding:12px 8px;font-size:17px;cursor:pointer}
.fonts button[aria-pressed="true"]{background:var(--tint-weak);color:var(--tint-text);box-shadow:inset 0 0 0 2px var(--tint)}
.sw{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;justify-items:center;padding:6px 0}
.sw button{width:48px;height:48px;border-radius:50%;border:0;cursor:pointer;padding:0;display:grid;place-items:center}
.sw button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--label)}
.sw button svg{width:20px;height:20px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.sw button[aria-pressed="true"] svg{opacity:1}
.cust{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--cell);border-radius:12px;padding:10px 16px}
.cust input{width:48px;height:32px;border:0;padding:0;background:none;cursor:pointer}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--fill);border-radius:10px;padding:2px;gap:2px}
.seg button{border:0;background:none;border-radius:8px;padding:8px 4px;font-size:15px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--cell);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.grip{flex:none;width:34px;height:34px;border:0;background:none;color:var(--label2);display:grid;place-items:center;cursor:grab;touch-action:none;padding:0;margin:-4px -8px -4px 0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.grip svg{width:22px;height:22px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;pointer-events:none}
.row.drag{background:var(--tint-weak)}
.row.drag::before{display:none}
body.dragging{user-select:none;-webkit-user-select:none;cursor:grabbing}
@media (prefers-reduced-motion: reduce){.row,.chk,.addbtn{transition:none}}
</style>

<div id="app">
  <header class="lt">
    <div class="ltrow"><h1>Da fare</h1><div class="hd"><button class="dot" id="colorBtn" type="button" aria-label="Colori e carattere"></button><button class="link" id="editBtn" type="button">Modifica</button></div></div>
    <p class="sub" id="sub"></p>
  </header>
  <form class="add" id="addForm" autocomplete="off">
    <input id="newText" type="text" placeholder="Nuova cosa da fare" enterkeyhint="done" aria-label="Nuova cosa da fare">
    <button class="addbtn" id="addBtn" type="submit" aria-label="Aggiungi" disabled><svg viewBox="0 0 24 24"><path d="M12 19V5M5.5 11.5L12 5l6.5 6.5"/></svg></button>
  </form>
  <div class="bulk"><button class="link small" id="bulkBtn" type="button">Incolla una lista…</button></div>
  <main id="list" aria-live="polite"></main>
</div>
<div id="sheet" hidden></div>
<div id="toast" hidden role="status"></div>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var LS='cose-da-fare-v1';
var CHECK='<svg viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7"/></svg>';
var S={items:[],edit:false,confirm:false,accent:'#34c759',theme:'auto',font:'sys'};
var FONTS=[['sys','Sistema','-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,Roboto,"Helvetica Neue",Arial,sans-serif'],['nun','Arrotondato',"'Nunito',system-ui,sans-serif"],['pop','Moderno',"'Poppins',system-ui,sans-serif"],['lor','Elegante',"'Lora',Georgia,serif"],['cav','A mano',"'Caveat','Segoe Script',cursive"],['mono','Tecnico',"'JetBrains Mono',ui-monospace,Menlo,monospace"]];
var ref=null,saving=false,touched=false,saveT=null,toastT=null,confT=null;
var reduced=false; try{reduced=matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function newId(){return 't'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3)}
function toast(m){var t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true},2400)}

/* ---------- salvataggio ---------- */
function loadLocal(){
  try{var a=JSON.parse(localStorage.getItem(LS)||'null');if(a&&Array.isArray(a.items))S.items=a.items;if(a&&a.accent)S.accent=a.accent;if(a&&a.theme)S.theme=a.theme;if(a&&a.font)S.font=a.font}catch(e){}
}
function pack(){return {items:S.items,accent:S.accent,theme:S.theme,font:S.font}}
function save(){
  touched=true;
  try{localStorage.setItem(LS,JSON.stringify(pack()))}catch(e){}
  clearTimeout(saveT);saveT=setTimeout(flush,500);
}
async function flush(){
  if(!ref) return;
  if(saving){clearTimeout(saveT);saveT=setTimeout(flush,400);return}
  saving=true;
  try{await ref.set(pack())}catch(e){}
  saving=false;
}

/* ---------- vista ---------- */
function rowHtml(it){
  if(S.edit){
    return '<div class="row ed" data-id="'+it.id+'"><button class="del" data-act="del" type="button" aria-label="Elimina">−</button>'
      +'<input id="e-'+it.id+'" data-edit value="'+esc(it.text)+'" aria-label="Testo">'
      +'<button class="grip" data-grip type="button" aria-label="Trascina per spostare"><svg viewBox="0 0 24 24"><path d="M4 8h16M4 12h16M4 16h16"/></svg></button></div>';
  }
  return '<div class="row'+(it.done?' done':'')+'" data-id="'+it.id+'">'
    +'<button class="chk" data-act="tog" type="button" role="checkbox" aria-checked="'+(!!it.done)+'" aria-label="'+esc(it.text)+'">'+CHECK+'</button>'
    +'<span class="tx" data-act="tog">'+esc(it.text)+'</span></div>';
}
function openHtml(open){
  var rows=open.map(rowHtml).join('');
  if(S.edit&&open.length>1) return '<h2 class="gh"><span>Da fare</span><button class="link small" data-act="az" type="button">Ordina A–Z</button></h2><div class="group">'+rows+'</div>';
  return '<div class="group" style="margin-top:20px">'+rows+'</div>';
}
function render(){
  var open=S.items.filter(function(i){return !i.done}),done=S.items.filter(function(i){return i.done});
  var sub;
  if(!S.items.length) sub='Nessuna voce';
  else if(!open.length) sub='Tutto fatto · '+done.length+(done.length===1?' voce':' voci');
  else sub=open.length+' da fare'+(done.length?' · '+done.length+' '+(done.length===1?'fatta':'fatte'):'');
  $('#sub').textContent=sub;
  $('#editBtn').textContent=S.edit?'Fine':'Modifica';
  $('#editBtn').hidden=!S.items.length;
  var h='';
  if(!S.items.length){
    h='<div class="empty"><div class="ic"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7"/></svg></div><h2>Niente da fare</h2><p>Scrivi la prima voce qui sopra, oppure incolla una lista intera.</p></div>';
  }else{
    if(open.length) h+=openHtml(open);
    else if(!S.edit) h+='<div class="empty" style="padding:34px 24px"><div class="ic"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7"/></svg></div><h2>Tutto fatto</h2></div>';
    if(done.length){
      h+='<h2 class="gh"><span>Fatte · '+done.length+'</span></h2><div class="group">'+done.map(rowHtml).join('')+'</div>';
      h+='<div class="group" style="margin-top:20px"><button class="row act" data-act="clear" type="button">'+(S.confirm?'Tocca ancora per eliminarle':'Elimina le fatte')+'</button></div>';
    }
  }
  $('#list').innerHTML=h;
}

/* ---------- azioni ---------- */
function add(texts){
  var n=0;
  texts.forEach(function(t){t=String(t).trim();if(t){S.items.push({id:newId(),text:t,done:false});n++}});
  if(n){save();render()}
  return n;
}
function toggle(id,row){
  var it=S.items.find(function(x){return x.id===id});if(!it) return;
  if(row&&row.classList.contains('leaving')) return;
  function apply(){it.done=!it.done;save();render()}
  if(row&&!reduced){row.classList.add('leaving');setTimeout(apply,170)}else apply();
}
function cleanLine(l){return l.replace(/^\s*(?:[-–•*·]|\d+[.)])\s+/,'').trim()}
function openSheet(){
  var el=$('#sheet');el.hidden=false;
  el.innerHTML='<div class="sh" role="dialog" aria-modal="true" aria-label="Incolla una lista">'
   +'<h3>Incolla una lista</h3><p>Una voce per riga. Trattini, puntini e numeri all\'inizio vengono tolti.</p>'
   +'<textarea id="bulk-text" aria-label="Lista" placeholder="Chiamare il dentista&#10;Comprare il latte&#10;Pagare la bolletta"></textarea>'
   +'<div class="stack"><button class="btn" data-act="bulk-ok" type="button">Aggiungi alla lista</button><button class="btn ghost" data-act="bulk-no" type="button">Annulla</button></div></div>';
  setTimeout(function(){var t=$('#bulk-text');if(t)t.focus()},50);
}
function closeSheet(){var el=$('#sheet');el.hidden=true;el.innerHTML=''}

$('#addForm').addEventListener('submit',function(e){
  e.preventDefault();
  var i=$('#newText');
  if(add([i.value])){i.value='';$('#addBtn').disabled=true}
  i.focus();
});
$('#newText').addEventListener('input',function(){$('#addBtn').disabled=!this.value.trim()});
$('#editBtn').addEventListener('click',function(){S.edit=!S.edit;S.confirm=false;render()});
$('#bulkBtn').addEventListener('click',openSheet);
$('#colorBtn').addEventListener('click',openColors);

document.addEventListener('click',function(e){
  var a=e.target.closest('[data-act]');if(!a) return;
  var act=a.dataset.act,row=a.closest('.row');
  if(act==='tog'){toggle(row.dataset.id,row)}
  else if(act==='del'){S.items=S.items.filter(function(x){return x.id!==row.dataset.id});save();render()}
  else if(act==='clear'){
    if(!S.confirm){S.confirm=true;render();clearTimeout(confT);confT=setTimeout(function(){S.confirm=false;render()},4000)}
    else{S.confirm=false;S.items=S.items.filter(function(x){return !x.done});save();render();toast('Voci eliminate')}
  }
  else if(act==='az'){sortAZ()}
  else if(act==='bulk-no'||act==='col-ok'){closeSheet()}
  else if(act==='bulk-ok'){
    var lines=($('#bulk-text').value||'').split(/\r?\n/).map(cleanLine).filter(Boolean);
    if(!lines.length){toast('Scrivi almeno una voce');return}
    var n=add(lines);closeSheet();toast(n+(n===1?' voce aggiunta':' voci aggiunte'));
  }
});
document.addEventListener('input',function(e){
  var f=e.target;if(!f.matches||!f.matches('[data-edit]')) return;
  var row=f.closest('.row'),it=S.items.find(function(x){return x.id===row.dataset.id});
  if(it){it.text=f.value;save()}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&!$('#sheet').hidden) closeSheet();
});

/* ---------- riordino ---------- */
function slotsOf(set){var s=[];S.items.forEach(function(it,i){if(set[it.id])s.push(i)});return s}
function applyOrder(group){
  var ids=Array.prototype.map.call(group.children,function(r){return r.dataset.id});
  var set={},byId={};
  ids.forEach(function(i){set[i]=1});
  S.items.forEach(function(it){byId[it.id]=it});
  slotsOf(set).forEach(function(si,k){S.items[si]=byId[ids[k]]});
}
function sortAZ(){
  var open=S.items.filter(function(i){return !i.done}),set={};
  open.forEach(function(i){set[i.id]=1});
  var slots=slotsOf(set);
  open.sort(function(a,b){return a.text.localeCompare(b.text,'it',{sensitivity:'base'})});
  slots.forEach(function(si,k){S.items[si]=open[k]});
  save();render();toast('Ordinate dalla A alla Z');
}
var drag=null;
function reorder(){
  var r=drag.row,y=drag.y,p,n,b;
  while((p=r.previousElementSibling)){b=p.getBoundingClientRect();if(y<b.top+b.height/2)drag.group.insertBefore(p,r.nextSibling);else break}
  while((n=r.nextElementSibling)){b=n.getBoundingClientRect();if(y>b.top+b.height/2)drag.group.insertBefore(n,r);else break}
}
function tick(){
  if(!drag) return;
  var y=drag.y,s=0,H=window.innerHeight||600;
  if(y<90) s=-Math.ceil((90-y)/6); else if(y>H-90) s=Math.ceil((y-(H-90))/6);
  if(s){window.scrollBy(0,s);reorder()}
  drag.raf=requestAnimationFrame(tick);
}
function endDrag(e){
  if(!drag||e.pointerId!==drag.id) return;
  cancelAnimationFrame(drag.raf);
  applyOrder(drag.group);
  drag=null;document.body.classList.remove('dragging');
  save();render();
}
document.addEventListener('pointerdown',function(e){
  var h=e.target.closest&&e.target.closest('[data-grip]');if(!h||drag) return;
  var row=h.closest('.row');if(!row) return;
  e.preventDefault();
  drag={row:row,group:row.parentNode,id:e.pointerId,y:e.clientY,raf:0};
  row.classList.add('drag');document.body.classList.add('dragging');
  try{h.setPointerCapture(e.pointerId)}catch(x){}
  tick();
});
document.addEventListener('pointermove',function(e){
  if(drag&&e.pointerId===drag.id){drag.y=e.clientY;reorder()}
});
document.addEventListener('pointerup',endDrag);
document.addEventListener('pointercancel',endDrag);

/* ---------- colori e aspetto ---------- */
var PRESETS=[['Verde','#34c759'],['Blu','#007aff'],['Viola','#af52de'],['Rosa','#ff2d55'],['Arancione','#ff9500'],['Turchese','#30b0c7'],['Rosso','#e5352b'],['Grafite','#7d7d85']];
function hexRgb(h){var m=/^#?([0-9a-f]{6})$/i.exec(h||'');if(!m) return null;var n=parseInt(m[1],16);return [(n>>16)&255,(n>>8)&255,n&255]}
function mix(c,t,a){return c.map(function(v,i){return Math.round(v*(1-a)+t[i]*a)})}
function rgb(c){return 'rgb('+c.join(',')+')'}
function applyLook(){
  var c=hexRgb(S.accent)||[52,199,89];
  var lt=rgb(mix(c,[0,0,0],.28)),dk=rgb(mix(c,[255,255,255],.1));
  var wl='rgba('+c.join(',')+',.15)',wd='rgba('+mix(c,[255,255,255],.1).join(',')+',.2)';
  var dark='--tint:'+dk+';--tint-text:'+dk+';--tint-weak:'+wd;
  var st=document.getElementById('look');
  if(!st){st=document.createElement('style');st.id='look';document.body.appendChild(st)}
  var fo=FONTS.filter(function(f){return f[0]===S.font})[0]||FONTS[0];
  st.textContent=':root{--font:'+fo[2]+';--tint:'+rgb(c)+';--tint-text:'+lt+';--tint-weak:'+wl+'}'
    +'@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){'+dark+'}}'
    +':root[data-theme="dark"]{'+dark+'}';
  var r=document.documentElement;
  if(S.theme==='light'||S.theme==='dark') r.setAttribute('data-theme',S.theme); else r.removeAttribute('data-theme');
}
function openColors(){
  var el=$('#sheet');el.hidden=false;
  var cur=hexRgb(S.accent)?S.accent.toLowerCase():'#34c759';
  var sw=PRESETS.map(function(p){return '<button type="button" data-col="'+p[1]+'" aria-label="'+p[0]+'" aria-pressed="'+(p[1]===cur)+'" style="background:'+p[1]+'">'+CHECK+'</button>'}).join('');
  var th=[['auto','Automatico'],['light','Chiaro'],['dark','Scuro']].map(function(t){return '<button type="button" data-theme-set="'+t[0]+'" aria-pressed="'+(S.theme===t[0])+'">'+t[1]+'</button>'}).join('');
  var fb=FONTS.map(function(f){return '<button type="button" data-font="'+f[0]+'" aria-pressed="'+(S.font===f[0])+'" style="font-family:'+f[2].replace(/"/g,'&quot;')+'">'+f[1]+'</button>'}).join('');
  el.innerHTML='<div class="sh" role="dialog" aria-modal="true" aria-label="Aspetto"><h3>Colori e carattere</h3>'
    +'<div class="cap">Colore principale</div><div class="sw">'+sw+'</div>'
    +'<div class="cust"><label for="cust">Colore personalizzato</label><input id="cust" type="color" value="'+cur+'"></div>'
    +'<div class="cap">Aspetto</div><div class="seg">'+th+'</div>'
    +'<div class="cap">Carattere</div><div class="fonts">'+fb+'</div>'
    +'<div class="stack"><button class="btn" data-act="col-ok" type="button">Fine</button></div></div>';
}
document.addEventListener('click',function(e){
  var c=e.target.closest('[data-col]');
  if(c){S.accent=c.dataset.col;applyLook();save();openColors();return}
  var fn=e.target.closest('[data-font]');
  if(fn){S.font=fn.dataset.font;applyLook();save();openColors();return}
  var t=e.target.closest('[data-theme-set]');
  if(t){S.theme=t.dataset.themeSet;applyLook();save();openColors()}
});
document.addEventListener('input',function(e){
  if(e.target&&e.target.id==='cust'){S.accent=e.target.value;applyLook();save()}
});

/* ---------- avvio ---------- */
async function boot(){
  loadLocal();applyLook();render();
  try{
    var cl=window.claude;if(!cl||!cl.use) return;
    var user=await cl.use('user'),dbm=await cl.use('db');
    var uid=user?await user.id():null;
    if(!dbm||!uid) return;
    ref=dbm.doc('data/users/'+uid+'/todos');
    var snap=await ref.get();
    if(touched){flush();return}
    if(snap.exists){
      var d=snap.data()||{};
      if(Array.isArray(d.items)) S.items=d.items;
      if(d.accent) S.accent=d.accent;
      if(d.theme) S.theme=d.theme;
      applyLook();
      try{localStorage.setItem(LS,JSON.stringify(pack()))}catch(e){}
      render();
    }else if(S.items.length){flush()}
  }catch(e){ref=null}
}
boot();
})();
